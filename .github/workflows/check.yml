name: Test OAL examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        example: [tiny-catalog, board-crm, work-board]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check delivery integrity
        run: python scripts/content_inventory.py --check
      - name: Check explicit structure
        run: python scripts/check_structure.py --edition Stable-v1.0.0
      - name: Check directed verifier regressions
        if: matrix.example == 'tiny-catalog'
        run: python scripts/test_release_checks.py
      - name: Check independent edition launchers
        if: matrix.example == 'tiny-catalog'
        run: python scripts/test_edition_launchers.py
      - name: Install example and test runner
        run: |
          python -m pip install -e "./versioning/Stable-v1.0.0/examples/${{ matrix.example }}"
          python -m pip install pytest==9.0.2
      - name: Check generated LaTeX is current
        if: matrix.example == 'board-crm'
        working-directory: versioning/Stable-v1.0.0/examples/board-crm/OAL-P1
        run: python render_ucs.py --check
      - name: Run example tests
        working-directory: versioning/Stable-v1.0.0/examples/${{ matrix.example }}
        run: python -m pytest -q
