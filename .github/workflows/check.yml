name: Test OAL examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        example: [tiny-catalog, board-crm, work-board]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: List examples from every edition
        run: python run_examples.py --list
      - name: Install example and test runner
        run: |
          python -m pip install -e "./versioning/Alpha-v0.2.0-Alkimim/examples/${{ matrix.example }}"
          python -m pip install pytest==9.0.2
      - name: Check generated LaTeX is current
        if: matrix.example == 'board-crm'
        working-directory: versioning/Alpha-v0.2.0-Alkimim/examples/board-crm/OAL-P1
        run: python render_ucs.py --check
      - name: Run example tests
        working-directory: versioning/Alpha-v0.2.0-Alkimim/examples/${{ matrix.example }}
        run: python -m pytest -q
