[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oal-work-board-example"
version = "0.2.0a0"
description = "Local work-item board illustrating the four OAL layers (L1-L4)."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{name = "OAL contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
oal-work-board = "work_board.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"work_board.transport" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
